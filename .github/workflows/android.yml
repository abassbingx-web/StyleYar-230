
name: StyleYar Android Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project files
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print

          SETTINGS=$(find . -name settings.gradle -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)
          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StyleYar-2.3.0-debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
